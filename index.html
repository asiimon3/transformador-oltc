<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Transformador con OLTC</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

.iso[data-theme="light"] .tf-cavity{--anatomy-paper:#ecece8;--anatomy-face:#f6f6f3;--anatomy-top:#f3f3ef;--anatomy-shade-0:#cfcfca;--anatomy-shade-1:#d8d8d3;--anatomy-shade-2:#e0e0db;--anatomy-shade-3:#e7e7e2;--anatomy-lit-top:#ffffff;--anatomy-lit-shade:#f4f4f1}
.tf-sw[data-on] .iso-fill{fill:var(--anatomy-face)}

.tf-sw[data-on] .iso-shade{fill:var(--anatomy-lit-shade)}
.tf-sw[data-on] .iso-edge{stroke:var(--anatomy-lit)}
.tf-sw[data-on] .iso-line{stroke:var(--anatomy-lit)}
.tf-sw[data-on] .iso-dots circle{opacity:1}
.tf-blade{fill:var(--anatomy-lit-top);stroke:var(--anatomy-lit);stroke-width:var(--anatomy-weight);stroke-linejoin:round;vector-effect:non-scaling-stroke}
.tf-hub{fill:var(--anatomy-top);stroke:var(--anatomy-hi);stroke-width:var(--anatomy-weight);vector-effect:non-scaling-stroke}
.tf-pin,.tf-cap{fill:var(--anatomy-dot)}
.tf-dial{fill:var(--anatomy-top);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);vector-effect:non-scaling-stroke}
.tf-window{fill:var(--anatomy-shade-0)}
.tf-window-edge{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);vector-effect:non-scaling-stroke}
.tf-digits{fill:var(--anatomy-hi);font-family:var(--anatomy-mono);letter-spacing:.06em}
.tf-band{stroke-width:1.8px}
.tf-needle{stroke-width:1px}
.tf-state{margin:10px 0 0;min-height:1.6em;font-family:var(--anatomy-mono);font-size:11px;line-height:1.5;color:var(--anatomy-strong)}
.tf-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.iso-stage{touch-action:pan-y}
.iso-stage:focus{outline:none}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}

// Modelo del transformador monofásico 400/220 kV con cambiador de tomas en carga (OLTC).
// Todo lo que la figura enseña (lecturas, posición de los contactos, esperas) sale de aquí.
// Es una unidad de un banco trifásico: las tensiones se dan entre fases, como las lee el operador.

const NOMINAL = { u1: 400, u2: 220, mva: 200 };

// Devanado de regulación en el lado de 400 kV (extremo de neutro): 8 escalones de 1,25 %
// y un inversor de polaridad, 17 posiciones, ±10 %. La posición 9 es la nominal.
const TAPS = { positions: 17, middle: 9, contacts: 9, step: 0.0125 };

// Impedancia de cortocircuito típica (resistiva y reactiva, en %) y factor de potencia de la carga.
const IMPEDANCE = { ur: 0.25, ux: 13, pf: 0.95 };

// Relé regulador de tensión (función ANSI 90): consigna, banda muerta y temporizaciones reales.
const AVR = { set: 220, band: 0.01, t1: 20, t2: 10 };

// La figura corre 5 veces más rápido que el tiempo real: 20 s de espera son 4 s en pantalla
// y una maniobra completa del mando a motor (unos 5 s) dura 1 s.
const SPEED = 5;
const OPERATION = 5;

// Contacto del selector y sentido del inversor para cada posición.
const contactOf = (position) => Math.abs(position - TAPS.middle);
const signOf = (position) => Math.sign(position - TAPS.middle);

// Subir de posición quita espiras del lado de 400 kV, así que la relación baja y U2 sube.
const turnsShare = (position) => 1 - TAPS.step * (position - TAPS.middle);

function dropOf(load) {
  const sin = Math.sqrt(1 - IMPEDANCE.pf * IMPEDANCE.pf);
  return (load * (IMPEDANCE.ur * IMPEDANCE.pf + IMPEDANCE.ux * sin)) / 100;
}

function u2Of(u1, load, position) {
  return ((u1 * NOMINAL.u2) / NOMINAL.u1 / turnsShare(position)) * (1 - dropOf(load));
}

// -1 si hay que bajar, +1 si hay que subir, 0 dentro de banda.
function needOf(u2) {
  const error = (u2 - AVR.set) / AVR.set;
  if (error < -AVR.band) return 1;
  if (error > AVR.band) return -1;
  return 0;
}

// Fases del ruptor (diverter) según el ángulo de la cuchilla, en grados:
// contactos principales a ±28°, contactos de resistencia a ±10°, zapata de ±11°.
const DIVERTER = { main: 28, resistor: 10, shoe: 11 };

function bridgeOf(angle) {
  const touches = (at) => Math.abs(angle - at) <= DIVERTER.shoe + 1e-9;
  return {
    mainA: touches(-DIVERTER.main),
    resA: touches(-DIVERTER.resistor),
    resB: touches(DIVERTER.resistor),
    mainB: touches(DIVERTER.main),
  };
}

function phaseOf(angle) {
  const b = bridgeOf(angle);
  if (b.resA && b.resB) return "puente RA + RB";
  if (b.mainA || b.mainB) return b.resA || b.resB ? "principal + resistencia" : "contacto principal";
  if (b.resA || b.resB) return b.resA ? "solo por RA" : "solo por RB";
  return "en vuelo";
}

const DATA = {"P":{"origin":[278.3412459049107,438.1655040157084],"scale":1.4188318891876508,"azimuth":56,"elevation":30},"TAP_Z":[58,64,70,76,82,88,94,100,106],"DIALS":{"u1":{"x":108,"y":41,"r":7,"z":29,"lo":380,"hi":420},"u2":{"x":124,"y":41,"r":7,"z":29,"lo":200,"hi":240},"tap":{"x":108,"y":58,"r":6.5,"z":29},"timer":{"x":124,"y":58,"r":5.5,"z":28.4}},"GAUGE":{"from":-2.356194490192345,"span":4.71238898038469},"OLTC_REST":[58,64]};
const { P: PR, TAP_Z: TZ, DIALS: DL, GAUGE: GA } = DATA;
const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const phaseEl = document.querySelector("[data-phase]");
const status = document.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const q = (s) => svgEl.querySelector(s);
const qa = (s) => [...svgEl.querySelectorAll(s)];
const armEls = [q('[data-arm="0"]'), q('[data-arm="1"]')];
const bladeEl = q('[data-part="blade"]');
const flip = Number(bladeEl.dataset.flip);
const leverEl = q('[data-part="lever"]');
const counterEl = q('[data-part="counter"]');
const needleEls = Object.fromEntries(Object.keys(DL).map((n) => [n, q('[data-needle="' + n + '"]')]));
const lampEls = Object.fromEntries(["raise", "lower", "auto"].map((n) => [n, q('[data-lamp="' + n + '"]')]));
const leadEls = qa("[data-lead]"), studEls = qa("[data-stud]"), carryEls = qa("[data-carry]"), touchEls = qa("[data-touch]"), resEls = qa("[data-res]");
const kv = (v) => v.toFixed(1).replace(".", ",");
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth01 = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const gaugeAngle = (d, v) => GA.from + clamp((v - d.lo) / (d.hi - d.lo), 0, 1) * GA.span;
const needle = (d, angle, len, tail) => lineOnTop([d.x - Math.sin(angle) * tail, d.y + Math.cos(angle) * tail], [d.x + Math.sin(angle) * len, d.y - Math.cos(angle) * len], d.z + 0.1, PR);
const setOn = (el, on) => { if (!el) return; if (on) el.setAttribute("data-on", ""); else el.removeAttribute("data-on"); };

// Estado de la máquina.
const ST = {
  u1: { x: 400, t: 400 }, load: { x: 0.4, t: 0.4 },
  pos: 10, arms: [0, 1], blade: DIVERTER.main, lever: 1,
  op: null, timer: 0, dir: 0, again: false, counter: 1284, slow: false,
};
window.__tf = ST;
const sideOf = (parity) => (parity ? 1 : -1) * DIVERTER.main;

function startOp(to) {
  const from = ST.pos, c = contactOf(to), parity = c % 2;
  ST.op = { from, to, u: 0, parity, armFrom: ST.arms[parity], armTo: c, bladeFrom: ST.blade, bladeTo: sideOf(parity),
    leverFrom: ST.lever, leverTo: signOf(to) !== 0 && signOf(to) !== ST.lever ? signOf(to) : ST.lever, done: false };
  say((to > from ? "subiendo" : "bajando") + " a la toma " + to);
}

function stepOp(dt) {
  const op = ST.op;
  op.u = Math.min(1, op.u + dt * SPEED / OPERATION * (ST.slow ? 0.1 : 1));
  const move = smooth01(0.08, 0.62, op.u);
  ST.arms[op.parity] = op.armFrom + (op.armTo - op.armFrom) * move;
  ST.lever = op.leverFrom + (op.leverTo - op.leverFrom) * smooth01(0.08, 0.5, op.u);
  ST.blade = op.bladeFrom + (op.bladeTo - op.bladeFrom) * smooth01(0.7, 0.8, op.u);
  if (!op.done && op.u >= 0.8) { op.done = true; ST.pos = op.to; ST.counter += 1; }
  if (op.u >= 1) { ST.arms[op.parity] = op.armTo; ST.lever = op.leverTo; ST.blade = op.bladeTo; ST.op = null; }
}

// Posición efectiva: durante el puente la tensión queda a medio escalón.
function effectivePosition() {
  if (!ST.op) return ST.pos;
  const b = bridgeOf(ST.blade), toSide = ST.op.parity ? "B" : "A", fromSide = toSide === "A" ? "B" : "A";
  const onTo = b["main" + toSide] || b["res" + toSide], onFrom = b["main" + fromSide] || b["res" + fromSide];
  if (onTo && onFrom) return (ST.op.from + ST.op.to) / 2;
  return onTo ? ST.op.to : ST.op.from;
}

function regulate(dt, u2) {
  if (ST.op) return;
  const need = needOf(u2);
  if (!need) { ST.timer = 0; ST.dir = 0; ST.again = false; return; }
  if (need !== ST.dir) { ST.timer = 0; ST.dir = need; ST.again = false; }
  const limit = (ST.again ? AVR.t2 : AVR.t1) / SPEED;
  ST.timer += dt * (ST.slow ? 0.1 : 1);
  if (ST.timer >= limit) {
    const to = ST.pos + need;
    ST.timer = 0;
    if (to < 1 || to > TAPS.positions) { ST.dir = 0; return; }
    ST.again = true;
    startOp(to);
  }
}

// Un día de red: la tensión de 400 kV sube y baja y la carga cambia.
const TOUR = [[0, 400, 0.4], [4, 409, 0.4], [10, 409, 0.9], [16, 393, 0.9], [22, 393, 0.25], [28, 400, 0.4]];
function tourAt(t) {
  const span = TOUR[TOUR.length - 1][0], x = t % span;
  for (let i = 1; i < TOUR.length; i++) if (x <= TOUR[i][0]) {
    const [t0, a0, b0] = TOUR[i - 1], [t1, a1, b1] = TOUR[i], s = smooth01(t0, t1, x);
    return [a0 + (a1 - a0) * s, b0 + (b1 - b0) * s];
  }
  return [TOUR[0][1], TOUR[0][2]];
}

let lastPhase = "";
function say(text) { if (status) status.textContent = text; }

function draw() {
  const pe = effectivePosition();
  const u2 = u2Of(ST.u1.x, ST.load.x, pe);
  armEls.forEach((el, parity) => {
    const c = ST.arms[parity];
    const z = TZ[0] + 6 * c;
    el.setAttribute("transform", translateAlong(PR, [0, 0, z]));
  });
  bladeEl.setAttribute("transform", "rotate(" + (ST.blade * flip).toFixed(2) + ")");
  leverEl.setAttribute("transform", "rotate(" + (ST.lever * 35 * flip).toFixed(2) + ")");
  const b = bridgeOf(ST.blade);
  const carrying = [b.mainA || b.resA, b.mainB || b.resB];
  const atContact = ST.arms.map((c) => (Math.abs(c - Math.round(c)) < 0.02 ? Math.round(c) : -1));
  leadEls.forEach((el) => { const c = Number(el.dataset.lead); setOn(el, carrying[c % 2] && atContact[c % 2] === c); });
  studEls.forEach((el) => { const c = Number(el.dataset.stud); setOn(el, carrying[c % 2] && atContact[c % 2] === c); });
  carryEls.forEach((el) => setOn(el, carrying[Number(el.dataset.carry)]));
  touchEls.forEach((el) => setOn(el, b[el.dataset.touch]));
  resEls.forEach((el) => setOn(el, el.dataset.res === "RA" ? b.resA : b.resB));
  counterEl.textContent = String(ST.counter).padStart(6, "0");
  needleEls.u1.setAttribute("d", needle(DL.u1, gaugeAngle(DL.u1, ST.u1.x), DL.u1.r - 1.6, 1.4));
  needleEls.u2.setAttribute("d", needle(DL.u2, gaugeAngle(DL.u2, u2), DL.u2.r - 1.6, 1.4));
  needleEls.tap.setAttribute("d", needle(DL.tap, GA.from + ((pe - 1) / (TAPS.positions - 1)) * GA.span, DL.tap.r - 1.6, 1.2));
  const waited = ST.timer * SPEED;
  needleEls.timer.setAttribute("d", needle(DL.timer, (waited / 20) * Math.PI * 2, DL.timer.r - 1.4, 1));
  setOn(lampEls.raise, ST.op ? ST.op.to > ST.op.from : ST.dir > 0);
  setOn(lampEls.lower, ST.op ? ST.op.to < ST.op.from : ST.dir < 0);
  setOn(lampEls.auto, true);
  let tail, phase;
  if (ST.op) {
    const stage = ST.op.u < 0.7 ? (ST.op.armFrom !== ST.op.armTo ? "preselección: el carro libre va a la toma " + ST.op.armTo : "carro ya preseleccionado") : ST.op.u < 0.8 ? "ruptor: " + phaseOf(ST.blade) : "cambio hecho";
    tail = ST.op.done ? "hecho" : "→ " + ST.op.to;
    phase = "cambio " + ST.op.from + " → " + ST.op.to + " · " + stage;
  } else if (ST.dir) {
    const limit = (ST.again ? AVR.t2 : AVR.t1);
    const left = Math.max(0, Math.ceil(limit - waited));
    tail = (ST.dir > 0 ? "subir" : "bajar") + " en " + left + " s";
    phase = "fuera de banda: el regulador espera " + limit + " s antes de " + (ST.dir > 0 ? "subir" : "bajar") + " una toma";
  } else {
    tail = "en banda";
    phase = "dentro de banda (220 kV ± 1 %): no se mueve nada";
  }
  readout.textContent = "U₂ " + kv(u2) + " kV · toma " + Math.round(pe) + "/17 · " + tail;
  phaseEl.textContent = "red " + Math.round(ST.u1.x) + " kV · carga " + Math.round(ST.load.x * 100) + " % · " + phase + (ST.slow ? " · cámara lenta" : "");
  if (phase.split(" · ")[0] !== lastPhase && !ST.op) { lastPhase = phase.split(" · ")[0]; }
  stage.setAttribute("aria-valuetext", "Toma " + ST.pos + " de 17, " + kv(u2) + " kilovoltios");
}

let frame = 0, last = 0, visible = false, touring = !still.matches, clock = 0, idle = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring) { clock += dt; [ST.u1.t, ST.load.t] = tourAt(clock); }
  const ease = calm ? 1 : 1 - Math.exp(-dt / 0.6);
  ST.u1.x += (ST.u1.t - ST.u1.x) * ease;
  ST.load.x += (ST.load.t - ST.load.x) * ease;
  if (ST.op) stepOp(calm ? 1 : dt);
  regulate(dt, u2Of(ST.u1.x, ST.load.x, ST.pos));
  draw();
  const settled = !touring && !ST.op && !ST.dir && Math.abs(ST.u1.t - ST.u1.x) < 0.01 && Math.abs(ST.load.t - ST.load.x) < 0.0005;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
const wake = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
function takeOver() {
  touring = false;
  clearTimeout(idle);
  idle = setTimeout(() => { if (!still.matches) { touring = true; clock = 0; wake(); } }, 9000);
  wake();
}
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) wake(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {
  const box = svgEl.getBoundingClientRect();
  const fx = clamp((event.clientX - box.left) / box.width, 0, 1), fy = clamp((event.clientY - box.top) / box.height, 0, 1);
  ST.u1.t = 380 + 40 * clamp((fx - 0.1) / 0.8, 0, 1);
  ST.load.t = 1 - clamp((fy - 0.1) / 0.8, 0, 1);
  takeOver();
});
stage.addEventListener("keydown", (event) => {
  let used = true;
  const big = event.shiftKey ? 5 : 1;
  if (event.key === "ArrowRight") ST.u1.t = clamp(Math.round(ST.u1.x) + 2 * big, 380, 420);
  else if (event.key === "ArrowLeft") ST.u1.t = clamp(Math.round(ST.u1.x) - 2 * big, 380, 420);
  else if (event.key === "ArrowUp") ST.load.t = clamp(Math.round(ST.load.x * 10) / 10 + 0.1 * big, 0, 1);
  else if (event.key === "ArrowDown") ST.load.t = clamp(Math.round(ST.load.x * 10) / 10 - 0.1 * big, 0, 1);
  else if (event.key === "Home") { ST.u1.t = 400; ST.load.t = 0.4; }
  else if (event.key === " ") { ST.slow = !ST.slow; say(ST.slow ? "cámara lenta" : "velocidad normal"); }
  else used = false;
  if (!used) return;
  event.preventDefault();
  takeOver();
});
stage.addEventListener("focus", () => say("Toma " + ST.pos + " de 17"));
draw();
</script></body></html>
